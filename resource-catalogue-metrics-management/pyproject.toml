[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-catalogue-metrics"
version = "0.0.1"
description = "resource-catalogue-metrics analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["geospatial", "metadata", "catalogue", "discovery"]
authors = [
    {name = "Angelos Tzotsos", email = "tzotsos@gmail.com"},
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"}
]
maintainers = [
    {name = "Angelos Tzotsos", email = "tzotsos@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "Click",
    "paho-mqtt",
    "requests"
]

[project.optional-dependencies]
dev = ["flake8"]
docs = ["zensical"]
release = ["build", "twine", "wheel"]

[project.scripts]
resource-catalogue-metrics = "resource_catalogue_metrics:cli"

[project.urls]
homepage = "https://github.com/EOEPCA/resource-catalogue-metrics"
source = "https://github.com/EOEPCA/resource-catalogue-metrics"
documentation = "https://github.com/EOEPCA/resource-catalogue-metrics"
issues = "https://github.com/EOEPCA/resource-catalogue-metrics/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docker", "Dockerfile"]
